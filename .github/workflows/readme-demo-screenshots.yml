name: Generate README demo screenshots

on:
  push:
    branches:
      - docs/readme-demo-screenshots

permissions:
  contents: write

jobs:
  screenshots:
    if: "!contains(github.event.head_commit.message, '[screenshots generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture viewer demo
        run: |
          python3 -m http.server 8765 --directory viewer &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          mkdir -p docs/screenshots
          cat > /tmp/capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            page.on('pageerror', e => console.error('PAGE_ERROR', e.message));
            const base = 'http://127.0.0.1:8765/_test/index.html';
            await page.goto(base, {waitUntil:'networkidle'});
            await page.waitForTimeout(1600);
            await page.screenshot({path:'docs/screenshots/inicio.png',fullPage:false});
            await page.locator('[data-nav="rutas"]').click();
            await page.waitForTimeout(900);
            await page.screenshot({path:'docs/screenshots/explorar-rutas.png',fullPage:false});
            await page.locator('[data-nav="descargas"]').click();
            await page.waitForTimeout(900);
            await page.screenshot({path:'docs/screenshots/descargas.png',fullPage:false});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/capture.cjs
      - name: Commit screenshots to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          git commit -m "Add demo screenshots [screenshots generated]"
          git push
